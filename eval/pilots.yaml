    note: Damn Vulnerable Python Web App (aiohttp + PostgreSQL).
  - name: juice-shop
    source: https://github.com/juice-shop/juice-shop.git
    ref: 717f5efa886b0417eeecb52378b03cf10567b7e2
    note: OWASP Juice Shop (Node/Express/Angular), large codebase.
  - name: fastapi-template
